name: CI/CD Pipeline for Vamsin App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Lint code
      - name: Run Flake8 Lint
        run: flake8 .

      # 5️⃣ Bandit security scan
      - name: Bandit Security Scan
        run: bandit -r .

      # 6️⃣ Trivy File System Scan
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          ignore-unfixed: true
          exit-code: '1'  # Fail workflow if vulnerabilities found

      # 7️⃣ Run Unit Tests + Coverage
      - name: Run Unit Tests with Coverage
        run: pytest --cov=vamsins --cov-fail-under=80

      # 8️⃣ Build Docker Image
      - name: Build Docker Image
        run: docker build -t vamsin-app:latest .

      # 9️⃣ Trivy Docker Image Scan
      - name: Trivy Docker Image Scan
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH vamsin-app:latest

      # 🔟 Push Docker Image to Docker Hub
      - name: Push Docker Image
        if: success()
        run: |
          echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
          docker tag vamsin-app:latest ${{ secrets.DOCKER_USER }}/vamsin-app:latest
          docker push ${{ secrets.DOCKER_USER }}/vamsin-app:latest
